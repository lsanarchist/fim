# Serves only the monitored website directory.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/fim;
    index index.html;
    autoindex off;
    disable_symlinks on;

    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
}
